[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aio-garmin-personal"
version = "0.2.0"
description = "Asynchronous client for the Garmin Connect Personal API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Oskar Majchrzak", email = "pentiak@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "detect-secrets==1.5.0",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-aiohttp==1.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "zizmor==1.31.1",
]

[project.urls]
Homepage = "https://github.com/pentiak/aio-garmin-personal"
Issues = "https://github.com/pentiak/aio-garmin-personal/issues"
Changelog = "https://github.com/pentiak/aio-garmin-personal/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aio_garmin_personal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=aio_garmin_personal --cov-report=term-missing --cov-fail-under=95"

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]

[tool.ruff]
required-version = ">=0.17.0"
target-version = "py313"

# Home Assistant core's rule set (ADR-0018), plus the complete bandit (S), datetime (DTZ),
# builtins (A), naming (N), comprehension (C4) and commented-out code (ERA) families.
[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C",
    "C4",
    "COM818",
    "D",
    "DTZ",
    "E",
    "ERA",
    "F",
    "FLY",
    "FURB",
    "G",
    "I",
    "INP",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T100",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "D202",
    "D203",
    "D213",
    "D406",
    "D407",
    "D417",
    "E501",
    "PLR0913",
    "PLR2004",
    "TC001",
    "TC002",
    "TC003",
    "TRY003",
    # Conflict with the formatter.
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "Q",
    "W191",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "SLF001"]
"scripts/**" = ["D", "T20", "INP001"]
